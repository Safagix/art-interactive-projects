<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ProfessionalStats — Gamified professional development tracker" />
  <title>ProfessionalStats</title>
  <!-- Google Fonts: Space Mono (headings) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="error-output" style="color: red; position: fixed; top: 0; left: 0; z-index: 99999; font-size: 24px; background: rgba(0,0,0,0.8); white-space: pre-wrap;"></div>
  <script>
    window.addEventListener('error', (event) => {
      document.getElementById('error-output').innerText += "\nERROR: " + event.message + "\n" + (event.error ? event.error.stack : '');
    });
    window.addEventListener('unhandledrejection', (event) => {
      document.getElementById('error-output').innerText += "\nPROMISE ERROR: " + (event.reason ? event.reason.stack || event.reason : 'unknown');
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
